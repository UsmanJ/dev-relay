name: CI

# Public CI runs ONLY offline checks with mock providers. It never installs,
# authenticates or calls Codex, Claude Code or any other AI provider, and it
# references no secrets. DEVRELAY_OFFLINE=1 makes DevRelay refuse every
# non-mock provider and skip even provider status checks.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DEVRELAY_OFFLINE: "1"
  DEVRELAY_DISABLE_CLAUDE_CLI: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Offline demo (mock agents)
        run: npm run demo
        env:
          DEVRELAY_DATA_DIR: ${{ runner.temp }}/devrelay-demo
