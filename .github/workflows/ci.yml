name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          # Tests use mock providers only; make sure no real CLI could be picked up.
          DEVRELAY_DISABLE_CLAUDE_CLI: "1"
      - run: npm run build
      - name: Offline demo (mock agents)
        run: npm run demo
        env:
          DEVRELAY_DATA_DIR: ${{ runner.temp }}/devrelay-demo